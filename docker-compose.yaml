services:
  web:
    image: php:8.5-apache
    ports:
      - "80:80"
    depends_on:
      - db
    volumes:
      - ./my_app:/var/www/html
  db:
    image: mysql:9.7
    ports:
      - "3306:3306"
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./my_mysql_data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      PMA_HOST: db